# LlamaFarm Configuration for OpenHoof
# Models for agent runtime: router (FunctionGemma) + reasoning (qwen/llama)

# LlamaFarm endpoint
# Server API: http://localhost:14345/v1/projects/{namespace}/{project}/chat/completions
# Universal Runtime: http://localhost:11540/v1/chat/completions
endpoint: "http://localhost:11540/v1"  # Universal Runtime

# Model definitions
models:
  # Tool router — any model that supports tool calling.
  # After fine-tuning, reference trained models by ft:{job_id} alias
  # (PR #785: ft: prefix resolved server-side, no GGUF path needed).
  # Examples:
  #   model: "ft:da674646"  # Round 4 best: 83-87% on 29-tool network eval   # base FunctionGemma
  #   model: "ft:911f2779"                           # fine-tuned (post-promote)
  #   model: "local/functiongemma-ft"                # local alias (post-promote)
  #   model: "unsloth/Qwen3-0.6B-GGUF"              # any small model
  router:
    model: "ft:da674646"  # Round 4 best: 83-87% on 29-tool network eval
    temperature: 0.1
    max_tokens: 512
    confidence_threshold: 0.85  # Min confidence to use router's normalized params
                                 # 0.85 = require 85% certainty, else use Reasoner's params
                                 # Lower = trust router more | Higher = trust Reasoner more
    # Router gets its own minimal system prompt — NOT the agent's SOUL.md.
    # FunctionGemma is a 270M model. It only needs to know it routes tool calls.
    system_prompt: "You are a function router. Given a request, select the correct tool and normalize its parameters. Return a single tool call only."
    purpose: "Tool routing only - maps user intent to tool calls"
    notes: "Fine-tuned on drone tools for <300ms routing"
  
  # Reasoning model (laptop/desktop)
  reasoning:
    model: "unsloth/Qwen3-1.7B-GGUF"
    temperature: 0.7
    max_tokens: 2048
    purpose: "Agent reasoning, decision-making, context understanding"
    notes: "Fast and capable for laptop deployment"
  
  # Mobile reasoning model (future Android deployment)
  mobile:
    model: "bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M"
    temperature: 0.7
    max_tokens: 1024
    purpose: "On-device inference for Android phones"
    notes: "Will use ONNX Runtime on phone, not LlamaFarm"
  
  # Fallback to OpenAI when network available
  fallback:
    model: "gpt-4o-mini"
    api_type: "openai"
    temperature: 0.7
    max_tokens: 4096
    purpose: "Network fallback for complex reasoning"
    notes: "Only used when local models insufficient or unavailable"

# Tool calling configuration
tool_calling:
  enabled: true
  pass_through: true  # LlamaFarm accepts tools in request
  format: "openai"    # OpenAI tool calling format

# System prompt configuration
system_prompt:
  pass_through: true  # LlamaFarm accepts system prompt in request
  source: "soul"      # Generated from SOUL.md

# Inference settings
inference:
  timeout_seconds: 30
  retry_attempts: 2
  retry_delay_seconds: 1
  
# Logging
logging:
  capture_training_data: true
  training_output_dir: ".microclaw/training"
  log_level: "info"

# DDIL (network fallback)
ddil:
  enabled: true
  buffer_dir: ".microclaw/ddil"
  sync_endpoint: "http://gateway.local/api/agent/sync"
  sync_on_heartbeat: true
