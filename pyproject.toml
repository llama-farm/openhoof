[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openhoof"
version = "2.2.0"
description = "Lightweight agent runtime library for autonomous edge agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "LlamaFarm", email = "hello@llamafarm.ai" }
]
keywords = ["ai", "agents", "llm", "llamafarm", "edge", "autonomous", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimal dependencies — runs on edge devices
dependencies = [
    "requests>=2.31.0",      # LlamaFarm API calls
    "pyyaml>=6.0",           # llamafarm.yaml config
    "pydantic>=2.5.0",       # Tool schema validation
]

[project.optional-dependencies]
# Training pipeline (FunctionGemma fine-tuning)
training = [
    "torch>=2.1.0",
    "transformers>=4.37.0",
    "peft>=0.7.0",
    "datasets>=2.16.0",
    "tqdm>=4.66.0",
]

# Development
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/llama-farm/openhoof"
Documentation = "https://github.com/llama-farm/openhoof/tree/main/docs"
Repository = "https://github.com/llama-farm/openhoof"
Issues = "https://github.com/llama-farm/openhoof/issues"

[tool.hatch.build.targets.wheel]
packages = ["openhoof"]

# Exclude workspace/runtime files from the package
exclude = [
    "*.md",
    "tests/",
    "examples/",
    "docs/",
    "experiments/",
    ".microclaw/",
    "memory/",
]

# Compat mode for older pip versions (pip < 21.3)
[tool.hatch.build.targets.editable]
mode = "compat"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
